name: Setup pnpm and Node
description: Sets up pnpm, then the Node version in .nvmrc with pnpm caching and the GitHub Packages registry. The caller checks out the repository first.

# Used by the typecheck, plan and deploy jobs of infra-ci.yml. It is not used by
# generate-pnpm-lockfile.yml: that job checks out a branch a user chose, and a
# local action would run from that checkout rather than from main.
runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
        registry-url: https://npm.pkg.github.com

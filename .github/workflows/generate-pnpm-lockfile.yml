name: Generate pnpm lockfile in CI

# Owner ruling (branchLeft/workspace#620, comment 5859923259): make a
# lockfile in CI with the workflow's own token, not a personal one. This
# repo depends on private `@branchleft/*` GitHub Packages packages
# (`ghost-platform-tenant`, `prettier-config`, `tsconfig`), and a workstation
# with no GitHub Packages read credential cannot authenticate the registry
# read `pnpm import`/`pnpm install` needs to produce `pnpm-lock.yaml` --
# there is nothing to seed a lockfile from locally. This is the pnpm variant
# of `branchLeft/ghost-platform`'s `generate-lockfile.yml` (PR
# branchLeft/ghost-platform#287): same trigger, same isolation, same guards,
# adapted for a single root package and a pnpm lockfile instead of an npm
# one in a `services/*`/`adapters/*` subdirectory.
#
# `workflow_dispatch` only, never `push` or `pull_request`, and certainly
# never `pull_request_target`: the `generate` job holds `contents: write`
# and ends by pushing a commit, and a repository write is not something any
# push or PR event should trigger on someone else's say-so. Dispatching it
# is itself the authorisation -- a person with write access, acting in the
# Actions tab (or `gh workflow run`) on this repository. `workflow_dispatch`
# also only ever targets a ref that already lives in this repository; there
# is no dispatch path that reaches a fork.
#
# Refuses `main` outright, and refuses any other branch a ruleset currently
# protects, checked live rather than against a name hardcoded here -- so a
# branch that becomes protected later is covered from the moment the
# ruleset exists, not only once someone remembers to add it to a list here.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch (in this repository) to check out, generate pnpm-lock.yaml on, and push the commit to'
        required: true

# Deny by default; each job below states exactly what it needs.
permissions: {}

# One dispatch at a time per branch: two overlapping runs racing to commit
# and push the same file would leave the loser's push rejected as
# non-fast-forward, and there is no reason to allow the race in the first
# place.
concurrency:
  group: generate-pnpm-lockfile-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate the branch and refuse a protected one
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      branch: ${{ steps.shape.outputs.branch }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate branch shape and refuse main
        id: shape
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          [ -n "$BRANCH" ] || fail "branch is empty"

          # A qualified ref (e.g. `refs/heads/main`) passes the name check
          # below (it's a valid ref-name string) and the live ruleset check
          # below (that endpoint takes a short branch name, so a qualified
          # form checks a ref that doesn't exist and comes back
          # unprotected) -- but `actions/checkout` treats an already-
          # qualified ref as literal, so `refs/heads/main` would check out
          # `main` while this job believes it validated something else, and
          # the later push would then write a new branch called
          # `refs/heads/main` rather than touching `main` at all. Refused
          # outright: every input here is a short branch name, never a
          # qualified ref.
          case "$BRANCH" in
            refs/*)
              fail "branch '$BRANCH' must be a short branch name, not a qualified ref -- pass 'main' style names, not 'refs/heads/...'"
              ;;
          esac

          # A fixed refusal, ahead of and independent of the live ruleset
          # check below: this workflow exists to unblock a feature branch's
          # own lockfile, never to write to the branch every ruleset here
          # protects, and that holds even if the ruleset check itself is
          # ever misconfigured, rate-limited, or returns something this
          # workflow doesn't recognise.
          case "$BRANCH" in
            main | master)
              fail "branch '$BRANCH' is refused outright: this workflow pushes a commit, and main/master are never a target."
              ;;
          esac

          # A conservative allow-list for a git ref name, not an attempt at
          # the full git ref-name grammar: reject rather than guess at
          # anything this doesn't recognise, since this value is about to be
          # used as a checkout ref and a push refspec.
          [[ "$BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] \
            || fail "branch '$BRANCH' contains characters outside A-Za-z0-9._/- , or does not start with one of those -- refusing rather than passing it to git"
          [[ "$BRANCH" != *..* ]] \
            || fail "branch '$BRANCH' contains '..' -- not a well-formed ref name"
          [[ "$BRANCH" != */ && "$BRANCH" != *.lock ]] \
            || fail "branch '$BRANCH' is not a well-formed ref name"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      # `rules/branches/{branch}` is the live ruleset-evaluation endpoint --
      # it answers with the rules that would apply to a push on that branch
      # right now, for a branch name whether or not it currently exists, and
      # (this repo is public) needs no elevated token permission to read.
      # Any non-200 is treated the same as "protected": this job would
      # rather block a legitimate branch than push to one it failed to prove
      # is unprotected.
      - name: Refuse a branch a ruleset currently protects
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.shape.outputs.branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! RULES_JSON="$(gh api "repos/$REPO/rules/branches/$BRANCH" 2>/tmp/rules-error.txt)"; then
            echo "::error::could not read the ruleset rules that apply to '$BRANCH' ($(cat /tmp/rules-error.txt)); refusing rather than guessing whether it is protected"
            exit 1
          fi
          RULE_COUNT="$(printf '%s' "$RULES_JSON" | jq 'length')"
          if [ "$RULE_COUNT" -gt 0 ]; then
            echo "::error::refusing '$BRANCH': $RULE_COUNT ruleset rule(s) currently apply to it. This workflow pushes a commit directly and never targets a branch a ruleset protects."
            exit 1
          fi
          echo "OK: no ruleset rule currently applies to '$BRANCH'"

  generate:
    name: Generate and push pnpm-lock.yaml
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: read

    steps:
      # Checks out the target branch directly -- not the ref this workflow
      # was dispatched from. `ref:` is the qualified form, not the bare
      # branch name `validate` produced: `actions/checkout` treats an
      # already-qualified ref as literal and a bare name as ambiguous (it
      # could resolve to a tag), and `validate` already refused any input
      # starting with `refs/` itself, so qualifying it here is the only
      # place this ref is assembled, and it always means the one thing it
      # says.
      #
      # `persist-credentials: false`: this job's token is `contents: write`,
      # and `pnpm import`/`pnpm install` run before the one step that needs
      # to push. The token is never in this job's git config while an
      # install (reading a package.json and a branch-supplied .npmrc) runs
      # -- it is added back, scoped to a single command, only in the push
      # step below.
      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/${{ needs.validate.outputs.branch }}
          persist-credentials: false

      - name: Confirm this branch has package.json, .nvmrc and package-lock.json
        env:
          BRANCH: ${{ needs.validate.outputs.branch }}
        run: |
          set -euo pipefail
          for f in package.json .nvmrc package-lock.json; do
            if [ ! -f "$f" ]; then
              echo "::error::'$f' does not exist on branch '$BRANCH'"
              exit 1
            fi
          done

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@branchleft'

      # Generates in a copy under $RUNNER_TEMP, never in the checkout itself
      # -- the checkout carries this branch's own committed `.npmrc`, and
      # npm/pnpm's project-level config outranks the user-level config
      # `setup-node` just wrote, in their own precedence order. A branch
      # author's `.npmrc` could point `@branchleft:registry` at a foreign
      # host paired with `_authToken=${NODE_AUTH_TOKEN}` and read this run's
      # token straight out of the environment. The isolated directory gets
      # only `package.json`, the existing `package-lock.json` (as the seed
      # `pnpm import` reads) and a `.npmrc` this step writes itself, mapping
      # the one scope this repo actually needs -- never the branch's own
      # copy.
      #
      # `pnpm import` seeds `pnpm-lock.yaml` from `package-lock.json`'s own
      # already-resolved versions; the `pnpm install --lockfile-only` after
      # it is pnpm's normal lockfile finalisation, not a fresh resolution --
      # together they are conversion, not an upgrade. Nothing here runs a
      # lifecycle script and nothing here installs to `node_modules`.
      - name: Generate pnpm-lock.yaml in an isolated directory
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WORKDIR="$RUNNER_TEMP/pnpm-lockfile-generate"
          mkdir -p "$WORKDIR"
          cp package.json "$WORKDIR/package.json"
          cp package-lock.json "$WORKDIR/package-lock.json"
          printf '@branchleft:registry=https://npm.pkg.github.com\n' > "$WORKDIR/.npmrc"
          (cd "$WORKDIR" && pnpm import)
          (cd "$WORKDIR" && pnpm install --lockfile-only)
          cp "$WORKDIR/pnpm-lock.yaml" "$GITHUB_WORKSPACE/generated-pnpm-lock.yaml"

      # The one gate between "pnpm resolved something" and a commit: every
      # package name package-lock.json and the freshly generated
      # pnpm-lock.yaml both name must resolve to the same version. A name
      # named by only one of the two is not itself a failure -- npm and
      # pnpm can shape a dependency tree's entries differently (peer/
      # optional dedup, platform-specific optional packages) without a
      # version having moved -- but any name both agree on naming must
      # agree on the version, or this refuses the commit. Inline rather than
      # a committed script: this job runs against whatever branch was
      # dispatched, and a script has to exist on that branch to be `run:`
      # from it -- this way there is nothing for an arbitrary target branch
      # to be missing or to have tampered with.
      - name: Refuse a version pnpm resolved that package-lock.json did not lock
        run: |
          python3 - "package-lock.json" "generated-pnpm-lock.yaml" <<'PYEOF'
          import json, re, sys

          npm_path, pnpm_path = sys.argv[1], sys.argv[2]

          with open(npm_path, encoding="utf-8") as f:
              npm_data = json.load(f)
          npm_versions = {}
          for key, meta in npm_data.get("packages", {}).items():
              if key == "" or "node_modules/" not in key:
                  continue
              tail = key.rsplit("node_modules/", 1)[1]
              version = meta.get("version")
              if version:
                  npm_versions[tail] = version

          if not npm_versions:
              print(f"::error::{npm_path} named no packages; refusing to trust an empty comparison")
              sys.exit(1)

          entry_re = re.compile(r"^  '?([^@'][^']*?)@([^:'\s]+)'?:\s*$")
          pnpm_versions = {}
          in_packages = False
          with open(pnpm_path, encoding="utf-8") as f:
              for line in f:
                  stripped = line.rstrip("\n")
                  if stripped == "packages:":
                      in_packages = True
                      continue
                  if in_packages:
                      if stripped and not stripped.startswith(" "):
                          break
                      if not stripped.strip():
                          continue
                      m = entry_re.match(stripped)
                      if m:
                          pnpm_versions[m.group(1)] = m.group(2)

          if not pnpm_versions:
              print(f"::error::{pnpm_path} named no packages; refusing to trust an empty comparison")
              sys.exit(1)

          mismatches = [
              (name, v, pnpm_versions[name])
              for name, v in sorted(npm_versions.items())
              if name in pnpm_versions and pnpm_versions[name] != v
          ]
          if mismatches:
              print("::error::pnpm resolved a version package-lock.json did not lock:")
              for name, npm_v, pnpm_v in mismatches:
                  print(f"  {name}: npm={npm_v} pnpm={pnpm_v}")
              sys.exit(1)

          print(f"OK: {len(npm_versions)} package-lock.json versions all agree with pnpm-lock.yaml where named in both")
          PYEOF

      - name: Apply the generated lockfile
        run: |
          set -euo pipefail
          mv generated-pnpm-lock.yaml pnpm-lock.yaml
          rm package-lock.json

      # `pnpm import`/`pnpm install --lockfile-only` above only ever ran in
      # the isolated directory; the two moves just made are the only change
      # this checkout should show. An exact match against both porcelain
      # forms, not a substring test -- a substring would also pass
      # `pnpm-lock.yaml.bak` or a rename whose destination happens to
      # contain one of these paths.
      - name: Refuse any change beyond the lockfile swap
        run: |
          set -euo pipefail
          CHANGED="$(git status --porcelain)"
          OTHER="$(printf '%s\n' "$CHANGED" | grep -v -x -F \
            -e '?? pnpm-lock.yaml' \
            -e ' D package-lock.json' || true)"
          if [ -n "$OTHER" ]; then
            echo "::error::the lockfile generation changed something other than the pnpm-lock.yaml/package-lock.json swap; refusing to commit any of it:"
            echo "$OTHER"
            exit 1
          fi

      - name: Commit and push the lockfile swap, if it happened
        env:
          BRANCH: ${{ needs.validate.outputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CHANGE="$(git status --porcelain)"
          if [ -z "$CHANGE" ]; then
            echo "no change to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml package-lock.json
          git commit -m "ci: generate pnpm-lock.yaml, remove package-lock.json"

          # Checkout ran with persist-credentials: false, so nothing has
          # written this token to .git/config yet. `-c` scopes it to this
          # one `git push` process only -- it never touches a file on disk,
          # and no later step (or a lifecycle script, had one run earlier)
          # can read it back out of the working tree's git config.
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            push origin "HEAD:refs/heads/$BRANCH"

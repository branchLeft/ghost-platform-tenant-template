name: Infra CI

# Type-checks this repo's Pulumi program on every PR, and applies its one
# stack on every push to main.
#
# Mirrors branchLeft/ghost-platform's infra/platform-ci.yml; the same five
# guardrails apply here:
#
#   1. The apply runs only on push to main. Pull requests get type-check
#      only -- the WIF-federated deployer SA that can create/mutate/delete
#      real infrastructure is never reachable from a PR run.
#   2. Credentials are short-lived, exchanged via Workload Identity
#      Federation and scoped by attributeCondition to this repository alone.
#      No service-account key exists anywhere.
#   3. The deployer identity, its federation and its roles are created by the
#      platform's provisioning flow and live in that stack's state, not this
#      one. This program cannot widen its own permissions because it does not
#      declare them.
#   4. A preflight parses the real `pulumi preview` plan for this exact run
#      and aborts before `pulumi up` if it would destroy protected
#      infrastructure (scripts/assert-no-tenant-deletes.py).
#   5. The deploy job declares an `environment`. It is a deployment-history
#      label here and does not gate -- see the `environment:` key below.
#   6. This stack's encryption salt is restored from a repository secret at
#      deploy time instead of being committed beside the ciphertexts it
#      unwraps, and a separate job refuses a tree that carries one
#      (scripts/assert-no-committed-pulumi-secrets.py).
#
# `npm ci` authenticates with the run's own GITHUB_TOKEN.
# @branchleft/ghost-platform-tenant is a public package, and any authenticated
# token can read one, so a tenant repo holds no long-lived credential of its
# own. GitHub Packages' npm registry still rejects anonymous requests, which is
# why a token is needed at all.
#
# `PULUMI_STATE_BUCKET`: this tenant has its own state bucket, written as a
# repo variable by the provisioning flow. Per-tenant rather than shared so a
# plain bucket-scoped `roles/storage.objectAdmin` is already correctly
# confined and no tenant can enumerate another's stacks -- an object-name
# prefix condition on a shared bucket cannot do that job, because
# `storage.objects.list` is evaluated against the bucket and the filestate
# backend resolves a stack by listing.
#
# `PULUMI_CONFIG_PASSPHRASE`: this tenant's own secrets passphrase, written as
# a repo secret by the provisioning flow at onboarding time and never shared
# with any other tenant or with the platform repo that created it. Read by
# every `pulumi` command in the deploy job below -- without it Pulumi cannot
# unwrap this stack's data key, and an unset repository secret expands to an
# empty string here rather than an absent variable, which the guard step below
# exists to catch.
#
# `PULUMI_ENCRYPTION_SALT`: this stack's encryption salt, held as a repo secret
# rather than committed beside the ciphertexts it unwraps. A salt in a tree
# anyone can clone is an offline verifier for the passphrase above -- whoever
# holds it can test candidates at their own rate, with no state backend and no
# cloud IAM in the loop -- which `branchLeft/standards` PUL-12 bans outright.
# The deploy job appends it to the working copy of the stack config for that
# job only.
#
# Both checkout steps set `persist-credentials: false` regardless: without
# it, the token GitHub issues for checkout would sit on disk for every later
# step in the job -- including `npm ci`'s transitive postinstall scripts --
# to read.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: npx tsc --noEmit

      # Skipped in the template repo itself, where an unsubstituted
      # placeholder is the correct, permanent state of `main` -- this step
      # exists for repos generated *from* the template. `!= true` (not
      # `== false`) so an absent/null `is_template` -- which live runs
      # against this repo confirm does not happen for push or pull_request,
      # but a future GitHub payload change is not this repo's to guarantee
      # -- fails open into running the check, not skipping it.
      - name: Verify template placeholders are substituted
        if: github.event.repository.is_template != true
        run: python3 scripts/assert-placeholders-substituted.py

      # Cheap, credential-free, and catches the way the deploy job's safety
      # gates die quietly. Runs here as well as in `deploy` so the PR that
      # introduces the drift fails, rather than the merge that ships it.
      # Unlike the placeholder check above, this is meaningful in the
      # template repo too -- it doesn't depend on placeholders being
      # substituted -- so it always runs.
      - name: Verify the delete-guard still covers every protected resource
        run: |
          python3 scripts/assert-no-tenant-deletes.py --self-test
          python3 scripts/assert-no-tenant-deletes.py --verify-coverage node_modules/@branchleft/ghost-platform-tenant/dist

  # Its own job, and deliberately not one `deploy` needs. What makes a
  # committed salt dangerous is publication: one already on `main` is already
  # in every clone, so refusing to apply does not take it back and would take
  # the tenant's site down instead. The gate that matters is the merge, which
  # means this check has to be in the branch ruleset to have any teeth -- see
  # README.md. The deploy job's own salt step reports the same condition as a
  # warning and deploys on the committed value, so a repo in that state keeps
  # working while it is fixed.
  #
  # It runs in the template repo too, where the scan finds no stack config at
  # all: that file arrives when a tenant repo is generated, and the guard has
  # to sit here to travel with it.
  secret-guard:
    name: Committed-secret guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Stdlib unittest, no runner to install and nothing from npm -- this job
      # holds no credential and needs none.
      - name: Script unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      # `--scan-tree` rather than a changed-file list: a salt that arrived on a
      # branch nobody checked has to fail here rather than at publication, and
      # a hook pattern that silently stops matching is a hook that passes
      # everything.
      - name: Refuse a committed encryption salt
        run: |
          python3 scripts/assert-no-committed-pulumi-secrets.py --self-test
          python3 scripts/assert-no-committed-pulumi-secrets.py --scan-tree .

  deploy:
    name: Deploy (pulumi up)
    runs-on: ubuntu-latest
    needs: [typecheck]

    # `!= true`, not `== false` -- see the type-check job's placeholder-guard
    # comment above for why an absent/null `is_template` must fail open into
    # running, not skipping.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.is_template != true

    # Required reviewers and wait timers are public-repository-only for
    # GitHub Free, Pro and Team alike, and a tenant repo is private by
    # design -- so no rule attached here would gate anything. An environment
    # carrying no protection rule does not pause a run and does not say so:
    # read `protection_rules`, never the presence of this key.
    environment: production

    # Job-level permissions replace the workflow-level block entirely --
    # every scope this job needs must be listed here.
    permissions:
      contents: read
      packages: read
      id-token: write

    # `cancel-in-progress: false` deliberately -- cancelling an apply
    # mid-flight leaves the stack locked and half-applied.
    concurrency:
      group: pulumi-deploy-__TENANT_NAME__
      cancel-in-progress: false

    env:
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Ahead of every other step -- a literal `__TENANT_NAME__` must never
      # reach `pulumi preview` (it would select a stack that doesn't exist)
      # let alone `pulumi up`, and this check needs neither npm ci's
      # dependencies nor GCP credentials to run.
      - name: Verify template placeholders are substituted
        run: python3 scripts/assert-placeholders-substituted.py

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA_EMAIL }}

      - name: Install Pulumi CLI
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0

      # Pulumi's passphrase provider reads PULUMI_CONFIG_PASSPHRASE from the
      # environment via a plain lookup, which does not distinguish "unset"
      # from "set to an empty string" -- and GitHub expands a repository
      # secret that does not exist to `''`, not to an error. So a missing
      # secret would not fail here or later; it would try to unwrap this
      # stack's data key with an empty passphrase and fail with a message
      # about the key, not about the secret. Cheap and credential-free, so it
      # runs before anything that would act on the stack under that empty
      # value.
      - name: Confirm this stack's secrets passphrase is set
        run: |
          if [ -z "$PULUMI_CONFIG_PASSPHRASE" ]; then
            echo "::error::PULUMI_CONFIG_PASSPHRASE is empty or unset. Refusing to continue: Pulumi would treat an empty value as a valid passphrase rather than failing closed."
            exit 1
          fi

      # An unset repo variable resolves to an empty string with no error, so
      # `pulumi login gs://` would otherwise fail somewhere further downstream
      # with a message about the backend rather than about the variable.
      - name: Log in to the Pulumi state backend
        env:
          STATE_BUCKET: ${{ vars.PULUMI_STATE_BUCKET }}
        run: |
          if [ -z "$STATE_BUCKET" ]; then
            echo "::error::the PULUMI_STATE_BUCKET repo variable is unset or empty"
            exit 1
          fi
          pulumi login "gs://$STATE_BUCKET"

      # The salt is not committed (branchLeft/standards PUL-12). It is appended
      # to the working copy here, for this job only, and never committed back.
      # Placed after the backend login and before `pulumi preview` -- the first
      # command that reads an encrypted value, not `up`.
      #
      # The value arrives through `env:` rather than as `${{ secrets.X }}`
      # inside `run`: an expression in `run` is substituted before the shell
      # parses the line, so a value carrying shell metacharacters would
      # execute.
      #
      # It skips rather than appends when the config already carries a salt,
      # and asks the guard script rather than matching the key again here --
      # two definitions of "a salt is committed" drift apart. Skipping is not
      # politeness: appending would leave a duplicate YAML mapping key, and the
      # two values would have to agree for the file to mean anything even where
      # a parser tolerated it. A repo in that state also has no secret to
      # restore from, so requiring one would break a deploy that works.
      #
      # Fails closed on an empty value, naming the repository secret rather
      # than the passphrase: otherwise Pulumi reads a config whose salt line is
      # blank, reports this stack's secrets as corrupt, and sends whoever
      # debugs it at the passphrase. The `v1:` prefix is checked for the same
      # reason -- the value reaches the secret by hand, so a truncated paste or
      # one that kept its `encryptionsalt: ` key in front is the realistic
      # failure, and it would otherwise surface as a decryption error.
      - name: Restore the stack's encryption salt
        env:
          PULUMI_ENCRYPTION_SALT: ${{ secrets.PULUMI_ENCRYPTION_SALT }}
        run: |
          config=Pulumi.__TENANT_NAME__.yaml
          if [ ! -f "$config" ]; then
            echo "::error::$config is missing. The provisioning flow commits this stack's config, and without it there is nothing for this job to deploy."
            exit 1
          fi
          # Captured rather than shown: on exit 1 the script's ::error::
          # annotations would mark a step that succeeded, and on any other
          # status they are the only evidence of what went wrong. `|| status=`
          # keeps `set -e` from aborting on the non-zero exit this expects.
          #
          # The script's exit status is three-valued: 0 clean, 1 a salt is
          # committed, 3 a named file could not be read. Only 1 may skip the
          # restore. A moved script, an absent interpreter, a config that is
          # not valid UTF-8 and argparse's own usage exit all land outside
          # that, and treating any of them as a committed salt would deploy
          # with no salt at all -- then send whoever reads the resulting
          # decryption error at the passphrase, which is the misdiagnosis the
          # checks below exist to prevent.
          salt_status=0
          salt_report=$(python3 scripts/assert-no-committed-pulumi-secrets.py "$config" 2>&1) || salt_status=$?
          if [ "$salt_status" -eq 1 ]; then
            echo "::warning::$config already carries an encryptionsalt, so none was restored and this stack still decrypts with the committed value. Move that value into the PULUMI_ENCRYPTION_SALT repository secret and delete the line from the file; the Committed-secret guard job fails while it is there."
            exit 0
          fi
          if [ "$salt_status" -ne 0 ]; then
            printf '%s\n' "$salt_report"
            echo "::error::scripts/assert-no-committed-pulumi-secrets.py exited $salt_status. That is neither 'no salt committed' (0) nor 'a salt is committed' (1), so whether $config carries one is unknown and this refuses to guess. The output above is the script's own."
            exit 1
          fi
          if [ -z "$PULUMI_ENCRYPTION_SALT" ]; then
            echo "::error::the PULUMI_ENCRYPTION_SALT repository secret is empty or unset, and $config carries no salt of its own. Set the secret to this stack's encryption salt before deploying."
            exit 1
          fi
          case "$PULUMI_ENCRYPTION_SALT" in
            v1:*) ;;
            *)
              echo "::error::the PULUMI_ENCRYPTION_SALT repository secret does not look like a Pulumi-generated salt (expected a 'v1:' prefix). Set it to the value alone, without the 'encryptionsalt: ' key in front of it."
              exit 1
              ;;
          esac
          printf '\nencryptionsalt: %s\n' "$PULUMI_ENCRYPTION_SALT" >> "$config"

      - name: Preview the plan
        run: pulumi preview --stack __TENANT_NAME__ --json > preview.json

      - name: Refuse to apply a plan that destroys tenant infrastructure
        run: |
          python3 scripts/assert-no-tenant-deletes.py --self-test
          python3 scripts/assert-no-tenant-deletes.py --verify-coverage node_modules/@branchleft/ghost-platform-tenant/dist

          if ! python3 scripts/assert-no-tenant-deletes.py preview.json; then
            echo "--- full plan follows ---"
            python3 -m json.tool preview.json
            exit 1
          fi

      - name: Apply
        run: pulumi up --stack __TENANT_NAME__ --yes

      - name: Write outcome to job summary
        if: always()
        # Bound rather than interpolated. `github.sha` is not attacker-shaped,
        # but a `${{ }}` inside `run` is substituted before the shell parses
        # the script, and that property is worth being able to state without
        # exceptions.
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo '## Tenant stack deploy'
            echo
            echo "Commit: \`${COMMIT_SHA}\`"
            echo
            echo '### Plan this run applied'
            echo
            echo '```json'
            # The preview plan holds resource URNs, step ops and this stack's
            # non-secret config. Safe to publish here -- this program sets no
            # config value as `secure:`. If one ever is, revisit.
            python3 -m json.tool preview.json 2>/dev/null \
              || echo '(no plan captured -- the run failed before preview)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
